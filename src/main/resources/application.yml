spring:
  application:
    name: adventure-book-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/adventurebook}
    username: ${SPRING_DATASOURCE_USERNAME:adventurebook}
    password: ${SPRING_DATASOURCE_PASSWORD:adventurebook}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v1/api-docs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adventurebook
      POSTGRES_USER: adventurebook
      POSTGRES_PASSWORD: adventurebook
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adventurebook"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/adventurebook
      SPRING_DATASOURCE_USERNAME: adventurebook
      SPRING_DATASOURCE_PASSWORD: adventurebook
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
